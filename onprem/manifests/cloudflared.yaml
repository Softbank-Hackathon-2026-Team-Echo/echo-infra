# Cloudflare Tunnel 커넥터. 기기에서 Cloudflare 로 나가는 연결만 쓰고, 들어오는 포트는 열지 않는다.
# 자격 증명 JSON 은 Secret cloudflared/tunnel-credentials(install.sh 가 파일에서 만든다). 저장소에는 없다.
# 모든 주소를 Traefik 으로 넘긴다. 어느 앱으로 갈지는 Traefik 이 Ingress 의 Host 로 정한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: __TUNNEL_ID__
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - service: http://traefik.kube-system.svc.cluster.local:80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  # 커넥터 2개가 같은 터널에 붙어 하나가 재시작돼도 끊기지 않는다.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
      annotations:
        echo/config-hash: "__CONFIG_HASH__"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7
          args: ["tunnel", "--config", "/etc/cloudflared/config/config.yaml", "run"]
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared
        - name: creds
          secret:
            secretName: tunnel-credentials
