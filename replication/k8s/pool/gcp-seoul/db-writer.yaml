# 서울(고객 GKE echo-dev-customer-gke)의 "지금 쓰기 담당 DB" 표지판. 도쿄 쪽(../aws-tokyo/db-writer.yaml)과 같은 방식.
#   A 가 쓰기 담당(평소·롤백 뒤): selector 없음 + EndpointSlice db-writer-manual 에 도쿄 A NLB 의 IP
#   B 가 쓰기 담당(컷오버 뒤): selector app=echo-pg → 이 클러스터의 B 파드
# 처음에는 selector 없이 만든다(평소 A 가 쓰기 담당) → 적용 직후 scripts/pool-point.sh B "$A_HOST" 로 A NLB IP 를 넣는다(../README.md 3단계).
# NLB 주소는 DNS 이름이라 그때 IP 로 풀어 넣는다(NLB 의 AZ 별 IP 는 NLB 를 지우기 전까지 그대로).
apiVersion: v1
kind: Service
metadata:
  name: db-writer
  namespace: echo-data
  labels: { app.kubernetes.io/part-of: echo-pool, echo/writer-of: app }
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
