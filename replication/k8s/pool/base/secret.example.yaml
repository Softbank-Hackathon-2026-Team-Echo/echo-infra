# 예시일 뿐, 이 파일을 apply 하지 않는다. 실제 Secret 은 손으로 만든다(저장소에 비밀값 0건, NFR-17).
# echo-data 의 echo-pg-secret(DB 관리자·복제 비밀번호)을 쓰지 않는다 — PgBouncer 가 아는 것은 아래 두 계정뿐.
#
# 만드는 법 (클러스터마다, README "적용" 2단계):
#
#   # app_rw 의 SCRAM 검증자를 쓰기 담당 DB 에서 읽는다(값을 화면에 출력하지 않고 바로 Secret 으로)
#   V=$(kubectl -n echo-data exec echo-pg-0 -c postgres -- psql -XtAU postgres -d app \
#         -c "select rolpassword from pg_authid where rolname='app_rw'")
#   ADMIN=$(openssl rand -base64 24)
#   kubectl -n echo-pool create secret generic echo-pgbouncer-secret \
#     --from-literal=ADMIN_PASSWORD="$ADMIN" \
#     --from-literal=userlist.txt="$(printf '"app_rw" "%s"\n"pgbouncer_admin" "%s"\n' "$V" "$ADMIN")"
#   unset V ADMIN
#
# 키 설명:
#   userlist.txt    app_rw = SCRAM 검증자(평문 아님). PgBouncer 가 이 값으로 앱을 인증하고 같은 값으로 DB 에 SCRAM pass-through 한다
#                   → A·B 의 app_rw 검증자가 같아야 한다(replication/k8s/scripts/sync-role-verifiers.sh, preflight 가 확인).
#                   pgbouncer_admin = 관리 콘솔 전용. DB 역할이 아니다.
#   ADMIN_PASSWORD  admin 사이드카가 관리 콘솔에 붙을 때 쓰는 pgbouncer_admin 평문 비밀번호
#
# app_rw 비밀번호를 바꾸면: 두 DB 에 같은 검증자 → 이 Secret 의 userlist 갱신 → PgBouncer RELOAD.
apiVersion: v1
kind: Secret
metadata:
  name: echo-pgbouncer-secret
  namespace: echo-pool
  labels: { echo/managed-by: dohyun-manual }
type: Opaque
stringData:
  ADMIN_PASSWORD: "REPLACE_ME"
  userlist.txt: |
    "app_rw" "SCRAM-SHA-256$4096:REPLACE_ME"
    "pgbouncer_admin" "REPLACE_ME"
