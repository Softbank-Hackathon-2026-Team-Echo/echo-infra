# 도쿄 풀 계층의 "지금 쓰기 담당 DB" 표지판. PgBouncer 는 이 이름만 본다(host=db-writer.echo-pool.svc.cluster.local).
# 평소(A 가 쓰기 담당): 같은 클러스터의 A → echo-pg.echo-data
# 컷오버 뒤(B 가 쓰기 담당): 서울 B 외부 LB 의 DNS 이름(README "B 의 DNS 이름") — ExternalName 은 IP 를 받지 못한다
# 바꾸는 것은 컷오버 스크립트만: kubectl -n echo-pool patch svc db-writer -p '{"spec":{"externalName":"<새 주소>"}}'
apiVersion: v1
kind: Service
metadata:
  name: db-writer
  namespace: echo-pool
  labels: { app.kubernetes.io/part-of: echo-pool, echo/writer-of: app }
spec:
  type: ExternalName
  externalName: echo-pg.echo-data.svc.cluster.local
