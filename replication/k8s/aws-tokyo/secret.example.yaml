# 예시일 뿐, 이 파일을 apply 하지 않는다. 실제 Secret 은 손으로 만든다(저장소에 비밀값 0건, NFR-17).
#
# 만드는 법 (값은 각자 안전하게 생성. 예: openssl rand -base64 24):
#
#   SUPER=...; APP=...; REPL=...; PGB=...
#   kubectl create secret generic echo-pg-secret -n echo-data \
#     --from-literal=POSTGRES_PASSWORD="$SUPER" \
#     --from-literal=APP_PASSWORD="$APP" \
#     --from-literal=REPL_PASSWORD="$REPL" \
#     --from-literal=PGB_AUTH_PASSWORD="$PGB" \
#     --from-literal=userlist.txt="\"pgbouncer_auth\" \"$PGB\""
#
# 키 설명:
#   POSTGRES_PASSWORD  수퍼유저 postgres 비밀번호
#   APP_PASSWORD       app_rw (앱·PgBouncer 가 쓰는 계정) 비밀번호
#   REPL_PASSWORD      repl_user (B 가 구독할 복제 전용 계정) 비밀번호
#   PGB_AUTH_PASSWORD  pgbouncer_auth (auth_query 로 pg_shadow 를 읽는 계정) 비밀번호
#   userlist.txt       PgBouncer 가 auth_user 로 접속할 때 쓰는 파일. pgbouncer_auth 의 평문 1줄
#
# 나중 hardening: 이 값들을 AWS Secrets Manager 에 두고 External Secrets/CSI 로 동기화(수동 Secret 대체).
apiVersion: v1
kind: Secret
metadata:
  name: echo-pg-secret
  namespace: echo-data
  labels: { echo/managed-by: dohyun-manual }
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  APP_PASSWORD: "REPLACE_ME"
  REPL_PASSWORD: "REPLACE_ME"
  PGB_AUTH_PASSWORD: "REPLACE_ME"
  userlist.txt: |
    "pgbouncer_auth" "REPLACE_ME"
