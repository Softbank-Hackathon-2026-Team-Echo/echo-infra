# A Postgres 를 서울(B)에서 구독할 수 있게 밖으로 낸다 (SPEC infra-7 "cross-cloud 연결").
# 공개 NLB 지만 GCP NAT(34.64.211.218, B Postgres·B PgBouncer 가 나가는 주소)만 받는다. 인증은 scram, 전송은 TLS(sslmode=require, 40-tls.yaml).
# 적용: kubectl --context echo-dev-eks apply -f replication/k8s/aws-tokyo/30-expose.yaml → EXTERNAL-IP(NLB DNS) 를 B 의 연결 문자열에 쓴다.
apiVersion: v1
kind: Service
metadata:
  name: echo-pg-external
  namespace: echo-data
  labels: { app: echo-pg, managed-by: dongok-manual }
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-name: echo-dev-pg-a
spec:
  type: LoadBalancer
  selector: { app: echo-pg }
  loadBalancerSourceRanges:
    - 34.64.211.218/32 # GKE 서울 NAT (B Postgres 구독 · B PgBouncer → A)
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
