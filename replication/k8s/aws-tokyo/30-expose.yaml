# A Postgres 를 서울(B)에서 구독할 수 있게 밖으로 낸다 (SPEC infra-7 "cross-cloud 연결").
# 공개 NLB 지만 GCP NAT(34.64.211.218, B Postgres·B PgBouncer 가 나가는 주소)만 받는다. 인증은 scram, 전송은 TLS(sslmode=require, 40-tls.yaml).
# 적용: kubectl --context echo-dev-eks apply -f replication/k8s/aws-tokyo/30-expose.yaml → EXTERNAL-IP(NLB DNS) 를 B 의 연결 문자열에 쓴다.
apiVersion: v1
kind: Service
metadata:
  name: echo-pg-external
  namespace: echo-data
  labels: { app: echo-pg, managed-by: dongok-manual, echo/managed-by: dohyun-manual }  # 파일 = 동옥, 적용 = 도현(11/4)
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-name: echo-dev-pg-a
    # 두 AZ 의 NLB 주소 어느 쪽으로 와도 A 파드에 닿게(11/7). 꺼져 있으면 DNS 가 A 파드가 있는 AZ 주소만 주고, 서울 풀 계층 표지판
    # (replication/k8s/pool, IP 로 적어 둠)이 A 파드가 다른 AZ 로 옮겨 가면 닿지 않는 주소를 가리킨다.
    service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
spec:
  type: LoadBalancer
  selector: { app: echo-pg }
  loadBalancerSourceRanges:
    - 34.64.211.218/32 # GKE 서울 NAT (B Postgres 구독 · B PgBouncer → A)
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
