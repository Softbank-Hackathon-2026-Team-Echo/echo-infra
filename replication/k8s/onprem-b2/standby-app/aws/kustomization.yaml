# AWS 도쿄 EKS(echo-dev-eks) 대기 앱. GCP 와 같은 매니페스트에 화면 표시용 환경 이름만 aws 로 바꾼다.
# 적용: kubectl --context echo-dev-eks apply -k standby-app/aws   (Secret onprem-standby-app 은 README 명령으로 먼저)
resources:
  - ..
patches:
  - target: { kind: Deployment, name: demo-app }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: aws
