# 컷오버 Job 한 번 (사람이 직접 돌릴 때의 예. echo-was 는 같은 모양을 만든다 — echo-was#75).
# 이름 = echo-cutover-<계획 앞 8자>-<시도>: 같은 이름이면 이미 있는 Job(= 다시 만들지 않음, 멱등).
# 바꿀 것: metadata.name, PLAN_ID, KIND, ALLOW_PROMOTE(재난 긴급 이전에서만 true), image(echo-ops.yaml 의 VAP 와 같은 digest)
# 실행: kubectl --context <GKE> -n echo-ops apply -f job.yaml && kubectl -n echo-ops logs -f job/<이름>
apiVersion: batch/v1
kind: Job
metadata:
  name: echo-cutover-11111111-1
  namespace: echo-ops
  labels: { app.kubernetes.io/part-of: echo-cutover }
spec:
  backoffLimit: 0                  # 다시 시도는 echo-was 가 상태를 보고 정한다(스크립트가 멱등)
  activeDeadlineSeconds: 120       # 넘으면 SIGTERM → 쓰기 정지 중이면 스크립트가 RESUME 하고 끝낸다
  ttlSecondsAfterFinished: 86400   # 하루 뒤 정리(로그는 이전 계획 로그에 남긴다)
  template:
    metadata:
      labels: { app.kubernetes.io/part-of: echo-cutover }
    spec:
      serviceAccountName: echo-cutover
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      containers:
        - name: cutover
          image: __CUTOVER_IMAGE__
          env:
            - { name: KIND, value: cutover }
            - { name: PLAN_ID, value: 11111111-1111-4111-8111-111111111111 }
            - { name: ALLOW_PROMOTE, value: "false" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # kubeconfig·aws 캐시를 /tmp 에 쓴다
            capabilities: { drop: [ALL] }
