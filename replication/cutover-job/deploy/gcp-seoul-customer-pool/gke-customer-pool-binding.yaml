# 생성 파일 — 고치지 말고 manifests/ 나 values.env 를 고친 뒤 render.sh 를 돌린다.
# B(서울 고객 클러스터 echo-dev-customer-gke) 풀 계층: 컷오버 Job 의 GSA(User)와 echo-pool Role 을 잇는다(gke-customer-binding.yaml 과 같은 신원).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: echo-cutover-gke-customer
  namespace: echo-pool
  labels: { app.kubernetes.io/part-of: echo-cutover }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: echo-cutover }
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: echo-dev-cutover@team-echo-final.iam.gserviceaccount.com
