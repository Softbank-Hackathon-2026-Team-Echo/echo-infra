# 생성 파일 — 고치지 말고 manifests/ 나 values.env 를 고친 뒤 render.sh 를 돌린다.
# 컷오버 Job 신원이 DB 네임스페이스(echo-data)에서 할 수 있는 것 (인프라 12.2, echo-infra#67). A(EKS)·B(GKE) 둘 다 같은 Role.
# 받는 쪽은 클러스터마다 다르다: GKE = KSA echo-ops/echo-cutover, EKS = access entry 의 쿠버네티스 그룹 echo-cutover.
# 적용: replication/cutover-job/README.md "적용" (사람이, 인프라 담당 확인 뒤).
#
# 범위(보안 #24, 김형래 11/5 리뷰):
#  - echo-data 만. 다른 네임스페이스·클러스터 범위 권한 없음
#  - secrets 읽기 없음(스크립트는 파드 안 환경 변수로 psql 을 부른다)
#  - pods/exec 는 echo-data 전체: PgBouncer 가 Deployment 라 파드 이름이 바뀌고 RBAC resourceNames 는 와일드카드를 받지 않는다.
#    echo-data 에는 DB 파드(echo-pg-0, echo-pgbouncer)만 있다
#  - ConfigMap 은 PgBouncer ini 하나만 읽고 고친다(파드 재시작 때 새 백엔드 유지, persist_backend) — 옛 방식. 풀 방식으로 다 옮기면 뺀다
#  - 풀 방식(replication/k8s/pool): 표지판 Service db-writer 를 읽고 고친다(selector 넣기·빼기), 그 뒤의 EndpointSlice db-writer-manual 을
#    만들고·고치고·지운다. selector 를 뺄 때 컨트롤러가 만든 표지판 EndpointSlice 도 라벨로 지운다(list·delete).
#    create·라벨 delete 는 RBAC 가 resourceNames 로 막지 못한다 → echo-data 의 EndpointSlice 는 만들고 지울 수 있다(대상은 스크립트가 라벨로 고정).
#    다른 Service 의 슬라이스를 지워도 컨트롤러가 곧 다시 만든다(selector 가 있으므로)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: echo-cutover
  namespace: echo-data
  labels: { app.kubernetes.io/part-of: echo-cutover }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [echo-pgbouncer]
    verbs: [get]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [echo-pg-external]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [echo-pgbouncer-ini]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [db-writer]
    verbs: [get, patch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    resourceNames: [db-writer-manual]
    verbs: [get, patch, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [create, list, delete]
  # selector 를 뺀 표지판에 옛 Endpoints 가 남으면 미러링 컨트롤러가 자기 쪽 슬라이스를 다시 만든다 → 표지판 것만 지운다
  - apiGroups: [""]
    resources: [endpoints]
    resourceNames: [db-writer]
    verbs: [delete]
