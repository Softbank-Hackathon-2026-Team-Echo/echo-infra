# 생성 파일 — 고치지 말고 manifests/ 나 values.env 를 고친 뒤 render.sh 를 돌린다.
# 컷오버 Job 신원이 DB 네임스페이스(echo-data)에서 할 수 있는 것 (인프라 12.2, echo-infra#67). A(EKS)·B(GKE) 둘 다 같은 Role.
# 받는 쪽은 클러스터마다 다르다: GKE = KSA echo-ops/echo-cutover, EKS = access entry 의 쿠버네티스 그룹 echo-cutover.
# 적용: replication/cutover-job/README.md "적용" (사람이, 인프라 담당 확인 뒤).
#
# 범위(보안 #24, 김형래 11/5 리뷰):
#  - echo-data 만. 다른 네임스페이스·클러스터 범위 권한 없음
#  - secrets 읽기 없음(스크립트는 파드 안 환경 변수로 psql 을 부른다)
#  - pods/exec 는 echo-data 전체: PgBouncer 가 Deployment 라 파드 이름이 바뀌고 RBAC resourceNames 는 와일드카드를 받지 않는다.
#    echo-data 에는 DB 파드(echo-pg-0, echo-pgbouncer)만 있다
#  - ConfigMap 은 PgBouncer ini 하나만 읽고 고친다(파드 재시작 때 새 백엔드 유지, persist_backend)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: echo-cutover
  namespace: echo-data
  labels: { app.kubernetes.io/part-of: echo-cutover }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [echo-pgbouncer]
    verbs: [get]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [echo-pg-external]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [echo-pgbouncer-ini]
    verbs: [get, patch]
