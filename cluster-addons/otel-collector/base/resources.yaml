# OTel Collector 한 벌 (인프라 9): Namespace · ServiceAccount · 파드 조회 권한 · Deployment(1개).
# 진입점 basic auth Secret(otel-remote-write)은 저장소에 없다 — 적용 절차서대로 Secret Manager 값으로 만든다.
apiVersion: v1
kind: Namespace
metadata:
  name: echo-otel
  labels:
    app.kubernetes.io/part-of: echo-otel
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: echo-otel
---
# prometheus receiver 의 kubernetes_sd(role: pod)가 모든 네임스페이스의 파드를 본다. 읽기만.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: echo-otel-collector
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: echo-otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: echo-otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: echo-otel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: echo-otel
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  # 둘이 동시에 떠 같은 시계열을 두 번 보내지 않게(진입점에서 out-of-order 거절) 내리고 올린다. 끊김은 한 번 긁기(15초) 남짓
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      serviceAccountName: otel-collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.164.0
          args: ["--config=/conf/collector.yaml"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RW_USERNAME
              valueFrom:
                secretKeyRef:
                  name: otel-remote-write
                  key: username
            - name: RW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: otel-remote-write
                  key: password
          envFrom:
            - configMapRef:
                name: otel-collector-env
          ports:
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
