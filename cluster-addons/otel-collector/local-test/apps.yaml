# 로컬 시험용 앱 (run.sh 가 k3s 에 적용). 운영에 적용하지 않는다.
# - demo-local/app      : echo-was 실행기와 같은 라벨·포트 이름 → 수집 대상
# - other-local/no-label: 같은 이미지지만 managed-by 라벨 없음 → 수집되면 안 된다
# - demo-local/traffic  : 앱에 읽기(/api/info)·쓰기(/api/writes, DB 없음 → 503) 요청을 보낸다(오류율 패널용)
apiVersion: v1
kind: Namespace
metadata:
  name: demo-local
---
apiVersion: v1
kind: Namespace
metadata:
  name: other-local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: demo-local
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: app }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
        app.kubernetes.io/managed-by: echo-was
    spec:
      containers:
        - name: app
          image: APP_IMAGE
          imagePullPolicy: IfNotPresent
          env:
            - { name: DATABASE_URL, value: "postgresql://none@127.0.0.1:1/none?connect_timeout=1" }
            - { name: ECHO_ENVIRONMENT, value: local }
            - { name: AUTO_MIGRATE, value: "false" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: demo-local
spec:
  selector: { app.kubernetes.io/name: app }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-label
  namespace: other-local
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: no-label }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: no-label
    spec:
      containers:
        - name: app
          image: APP_IMAGE
          imagePullPolicy: IfNotPresent
          env:
            - { name: DATABASE_URL, value: "postgresql://none@127.0.0.1:1/none?connect_timeout=1" }
            - { name: AUTO_MIGRATE, value: "false" }
          ports:
            - { name: http, containerPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic
  namespace: demo-local
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: traffic }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic
    spec:
      containers:
        - name: traffic
          image: APP_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import time, urllib.request
              n = 0
              while True:
                  n += 1
                  try:
                      if n % 5 == 0:
                          urllib.request.urlopen(urllib.request.Request("http://app.demo-local/api/writes", method="POST"), timeout=5)
                      else:
                          urllib.request.urlopen("http://app.demo-local/api/info", timeout=5)
                  except Exception:
                      pass
                  time.sleep(0.2)
