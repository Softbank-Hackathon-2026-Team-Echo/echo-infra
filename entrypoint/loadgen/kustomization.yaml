apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: echo-loadgen
resources:
  - namespace.yaml
  - deployment.yaml
configMapGenerator:
  - name: loadgen-script
    files:
      - loadgen.js
  - name: loadgen-config
    literals:
      # 진입점 공인 주소(terraform output entrypoint_ip). 내부 IP 가 아니라 공인 주소로 보내 고객 경로를 그대로 탄다.
      - TARGET_URL=http://34.158.202.103
      # 시연 앱의 고정 주소. 진입점 뒤 ALB·GKE 인그레스는 Host 로 앱을 고른다.
      - TARGET_HOST=shop.echoport.uk
      - TARGET_PATH=/
      - RATE=50
generatorOptions:
  disableNameSuffixHash: true
