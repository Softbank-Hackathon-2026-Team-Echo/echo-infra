# 고정 진입점 한 벌: envoy(80) · weights-api(8080) · prometheus(9090) · grafana(3000).
# 로컬: cp .env.example .env 후 docker compose up -d --build. VM: startup 스크립트가 같은 명령을 돈다.
# json-file 로그는 돌리지 않으면 디스크(20GB)를 채운다. Envoy 는 요청마다 한 줄을 남긴다.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  weights-api:
    build: ./weights-api
    image: echo-entry-weights-api:local
    restart: unless-stopped
    logging: *logging
    environment:
      WEIGHTS_TOKEN: ${WEIGHTS_TOKEN:?WEIGHTS_TOKEN 을 .env 에 넣는다}
      UPSTREAMS: ${UPSTREAMS:?UPSTREAMS 를 .env 에 넣는다 (aws=host:port,gcp=host:port)}
      DEFAULT_WEIGHTS: ${DEFAULT_WEIGHTS:-aws=100,gcp=0}
      SYNC_FROM: ${SYNC_FROM:-}
      # 인프라 9: Prometheus 가 basic auth 를 켜면 /summary 쿼리에 붙인다("사용자:비밀번호"). 비면 안 붙인다.
      PROMETHEUS_BASIC_AUTH: ${PROMETHEUS_BASIC_AUTH:-}
    volumes:
      - envoy-dynamic:/etc/envoy/dynamic
    ports:
      - "${WEIGHTS_API_PORT:-8080}:8080"

  envoy:
    image: envoyproxy/envoy:v1.39.6
    restart: unless-stopped
    logging: *logging
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    volumes:
      - ./config/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - envoy-dynamic:/etc/envoy/dynamic:ro
    ports:
      - "${ENTRY_HTTP_PORT:-80}:80"
      # admin 은 호스트 안에서만 (quitquitquit 등 변경 API 가 있다). Prometheus 는 도커 네트워크로 긁는다.
      - "127.0.0.1:9901:9901"
    depends_on:
      weights-api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    logging: *logging
    # 인프라 9: 클러스터 OTel 수집기의 remote write(/api/v1/write) 수신. 기본 꺼짐 — 켜면 web.yml basic auth 도 같이 켠다
    # (basic auth 는 쿼리·UI 를 포함한 모든 경로에 걸린다 → weights-api·Grafana 도 같은 계정으로 읽는다).
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.config.file=/etc/prometheus/web.yml"
      # 불리언 플래그는 =true/false 를 받지 않는다("unexpected true" 로 기동 실패, 로컬 확인) → --[no-] 형태로 넣는다.
      - "--${PROMETHEUS_REMOTE_WRITE_FLAG:-no-web.enable-remote-write-receiver}"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${PROMETHEUS_WEB_CONFIG:-./config/prometheus-web-off.yml}:/etc/prometheus/web.yml:ro
      - prom-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.2.5
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 를 .env 에 넣는다}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # 데이터소스 basic auth 비밀번호(인프라 9, datasources/prometheus.yml 이 읽는다). 인증이 꺼진 Prometheus 는 무시한다.
      PROMETHEUS_BASIC_AUTH_PASSWORD: ${PROMETHEUS_BASIC_AUTH_PASSWORD:-}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  envoy-dynamic:
  prom-data:
  grafana-data:
