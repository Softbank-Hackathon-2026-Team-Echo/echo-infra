# 고정 진입점 Envoy 부트스트랩. 여기에는 리스너·admin 만 두고,
# 클러스터(CDS)·라우트(RDS)는 /etc/envoy/dynamic 의 파일을 읽는다. weights-api 가 그 파일을 쓴다.
# 파일을 같은 디렉터리에서 rename 하면(IN_MOVED_TO) Envoy 가 다시 읽는다 → 재시작 없이 가중치가 바뀐다.
node:
  id: entrypoint
  cluster: echo-entry

admin:
  # Prometheus 가 도커 네트워크에서 긁어야 하므로 0.0.0.0. 호스트 밖 노출은 compose 와 방화벽이 막는다.
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

# 동시 다운스트림 연결 상한. e2-small 에서 터지지 않게 보수적으로 잡는다.
overload_manager:
  resource_monitors:
    - name: envoy.resource_monitors.global_downstream_max_connections
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
        max_active_downstream_connections: 5000

# 런타임 값. 요청 기록 필터(인프라 12.4)는 journal.enabled(0~100 %)로 켠다 — 기본 0 = 꺼짐.
# 켜기: curl -X POST '127.0.0.1:9901/runtime_modify?journal.enabled=100' (admin 층, Envoy 재시작하면 다시 0)
layered_runtime:
  layers:
    - name: static
      static_layer:
        journal.enabled: 0
    - name: admin
      admin_layer: {}

dynamic_resources:
  cds_config:
    path_config_source:
      path: /etc/envoy/dynamic/clusters.yaml
      watched_directory:
        path: /etc/envoy/dynamic

static_resources:
  # 요청 기록 서비스(인프라 12.4). 동적 clusters.yaml 은 weights-api 소유라 여기 정적으로 둔다.
  clusters:
    - name: journal
      type: STRICT_DNS
      connect_timeout: 0.25s
      load_assignment:
        cluster_name: journal
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: journal, port_value: 8081 }
  listeners:
    - name: http
      address:
        socket_address: { address: 0.0.0.0, port_value: 80 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                use_remote_address: true
                # Cloudflare 프록시 뒤에 두면 xff_num_trusted_hops: 1 로 올린다.
                xff_num_trusted_hops: 0
                rds:
                  route_config_name: echo_routes
                  config_source:
                    path_config_source:
                      path: /etc/envoy/dynamic/routes.yaml
                      watched_directory:
                        path: /etc/envoy/dynamic
                http_filters:
                  # 요청 기록(인프라 12.4, specs/infra-12.4-request-journal.md). 쓰기를 journal 에 남긴 뒤 업스트림으로 보낸다.
                  # 기본 꺼짐(journal.enabled=0). journal 이 죽거나 느리면 통과(failure_mode_allow) — 시연 앱이 멈추지 않게.
                  # journal 이 429 를 주면(재생 중 hold) 클라이언트에 그대로 429 + Retry-After. 5xx 는 고장으로 보고 통과시키므로 4xx 를 쓴다.
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: true
                      filter_enabled:
                        default_value: { numerator: 0, denominator: HUNDRED }
                        runtime_key: journal.enabled
                      with_request_body:
                        max_request_bytes: 65536
                        allow_partial_message: true
                      http_service:
                        server_uri: { uri: "http://journal:8081", cluster: journal, timeout: 0.5s }
                        path_prefix: /check
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - { exact: x-request-id }
                              - { exact: idempotency-key }
                              - { exact: content-type }
                        authorization_response:
                          allowed_client_headers:
                            patterns:
                              - { exact: retry-after }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          ts: "%START_TIME%"
                          method: "%REQ(:METHOD)%"
                          host: "%REQ(:AUTHORITY)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          status: "%RESPONSE_CODE%"
                          flags: "%RESPONSE_FLAGS%"
                          duration_ms: "%DURATION%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          upstream_host: "%UPSTREAM_HOST%"
                          client: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
    # 443/TLS 리스너 자리. 지금은 Cloudflare 프록시가 TLS 를 끝내고 80 으로 보낸다.
    # 직접 TLS 를 받게 되면 여기 listener 를 추가하고 transport_socket 에 인증서를 건다.
